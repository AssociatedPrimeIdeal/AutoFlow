site_name: AutoFlow · 4D Flow MRI
site_description: Functional guides and complete parameter references for 4D flow MRI processing
site_author: AutoFlow contributors
site_url: https://associatedprimeideal.github.io/autoflow-docs/
repo_url: https://github.com/AssociatedPrimeIdeal/AutoFlow
repo_name: AssociatedPrimeIdeal/AutoFlow
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright © AutoFlow contributors

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: custom
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: custom
      accent: teal

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start:
      - Quickstart: en/user/quickstart.md
      - Worked example: en/user/demo-case.md
      - GUI workflow: en/user/gui.md
      - CLI workflow: en/user/cli.md
      - Python API: en/user/python-api.md
      - Inputs and units: en/user/inputs.md
      - Outputs: en/user/outputs.md
      - Troubleshooting: en/user/troubleshooting.md
  - Features:
      - Functional workflow: en/features/index.md
      - Data preparation:
          - DICOM loading and conversion: en/features/dicom-loading.md
          - Background phase correction: en/features/background-phase-correction.md
          - Phase unwrapping: en/features/phase-unwrapping.md
          - Segmentation and review: en/features/segmentation.md
      - Vessel geometry:
          - Skeleton: en/features/skeleton.md
          - Graph and paths: en/features/graph-paths.md
          - Cross-section planes: en/features/planes.md
      - Haemodynamics:
          - Plane metrics: en/features/metrics.md
          - Wall shear stress: en/features/wss.md
          - Turbulent kinetic energy: en/features/tke.md
          - Pressure and pressure gradient: en/features/pressure.md
          - Pulse wave velocity: en/features/pwv.md
          - Vortex kinematics: en/features/vortex-kinematics.md
      - Visualization and delivery:
          - Streamlines: en/features/streamlines.md
          - Pathlines: en/features/pathlines.md
          - PC-MRA: en/features/pcmra-volume-rendering.md
          - Quality control: en/features/quality-control.md
          - Videos: en/features/videos.md
  - Parameters:
      - Configuration by module: en/user/parameters.md
      - Structured dictionaries: en/user/parameter-schemas.md
      - CLI flags: en/user/cli-parameters.md
      - Python API fields: en/user/api-parameters.md
  - Development:
      - Architecture: en/developer/architecture.md
      - Modules and code owners: en/developer/feature-to-code-map.md
      - Configuration system: en/developer/config-system.md
      - Change recipes: en/developer/change-recipes.md
      - Testing and documentation checks: en/developer/testing.md
      - Current pipeline performance: en/developer/performance.md
      - Segmentation performance history: en/developer/segmentation-performance.md

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
