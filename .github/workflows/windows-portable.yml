# Automatic Windows builds and Releases are disabled; CI does not call this workflow.
name: Windows portable build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish a numbered release after verification

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ inputs.publish && 'release' || github.ref }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYVISTA_OFF_SCREEN: "true"
      QT_QPA_PLATFORM: "offscreen"
      VTK_DEFAULT_OPENGL_WINDOW: "vtkOSOpenGLRenderWindow"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select package version
        id: version
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          if ($env:PUBLISH_RELEASE -eq 'true') {
            python packaging/windows/release.py plan --output $env:GITHUB_OUTPUT
            if ($LASTEXITCODE -ne 0) { throw 'Release version selection failed' }
          } else {
            "version=dev-$($env:GITHUB_SHA.Substring(0,8))" >> $env:GITHUB_OUTPUT
          }
      - name: Set up headless rendering for portable verification
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1.0
        with:
          qt: true
          install-mesa3d-offscreen: true
      - name: Restore locked inference models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/autoflow-models
          key: inference-models-${{ hashFiles('packaging/windows/models.lock.json') }}
      - name: Download locked inference models
        shell: pwsh
        run: |
          python packaging/windows/download_models.py --cache "$env:RUNNER_TEMP/autoflow-models" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Inference model download failed' }
      - name: Build and verify full portable folder
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lock = Get-Content packaging/windows/models.lock.json -Raw | ConvertFrom-Json
          ./packaging/windows/build.ps1 -PythonBin python -EnvironmentDirectory "$env:RUNNER_TEMP/af-env" -OutputDirectory "$env:RUNNER_TEMP/af-release" -ModelsArchive "$env:RUNNER_TEMP/autoflow-models/$($lock.asset)" -Version $env:PACKAGE_VERSION
      - name: Upload portable verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlow-windows-diagnostics
          path: ${{ runner.temp }}/af-release/AutoFlow-*/build-check.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Select build artifacts
        shell: pwsh
        run: |
          $artifacts = "$env:RUNNER_TEMP/af-release/artifacts"
          $upload = "$env:RUNNER_TEMP/af-artifacts"
          New-Item -ItemType Directory -Path $upload -Force | Out-Null
          $manifest = Get-Content "$artifacts/release-manifest.json" -Raw | ConvertFrom-Json
          $names = @('release-manifest.json', 'Join-Portable.ps1', "$($manifest.archive).sha256")
          if ($manifest.parts.Count) { $names += @($manifest.parts | ForEach-Object { $_.file }) } else { $names += $manifest.archive }
          foreach ($name in $names) { Move-Item -LiteralPath (Join-Path $artifacts $name) -Destination $upload }
          Get-ChildItem "$env:RUNNER_TEMP/af-release/AutoFlow-*/build-check.json" | Copy-Item -Destination "$upload/build-check.json"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFlow-windows-x64
          path: ${{ runner.temp }}/af-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: AutoFlow-windows-x64
          path: ${{ runner.temp }}/af-artifacts
      - name: Publish verified portable package
        run: python packaging/windows/release.py publish --version "$PACKAGE_VERSION" --artifacts "$RUNNER_TEMP/af-artifacts"
