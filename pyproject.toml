[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow-mri"
version = "1.0.0"
description = "Automated processing pipeline for 4D flow MRI with optional Qt GUI."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "networkx",
  "pyvista",
  "h5py",
  "imageio",
  "Pillow",
]

[project.optional-dependencies]
gui = [
  "PyQt5",
  "pyvistaqt",
  "matplotlib",
]
test = [
  "pytest",
]

[project.scripts]
autoflow-run = "autoflow.cli:main"
autoflow-gui = "autoflow.ui.launcher:main"

[tool.setuptools.packages.find]
include = ["autoflow", "autoflow.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
