[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow-mri"
version = "2.0.0"
description = "Automated processing pipeline for 4D flow MRI with optional Qt GUI."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "scipy",
  "pyamg>=5.0,<6",
  "scikit-image",
  "networkx",
  "pyvista",
  "h5py",
  "pydicom",
  "imageio",
  "Pillow",
  "PyMaxflow",
]

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.5,<10",
]
test = [
  "pytest",
]
gui = [
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "pyvistaqt",
  "matplotlib",
  "numpy<2",
  "nnunetv2==2.5.2",
  "nibabel",
]
labeler = [
  "spatiotemporal-labeler @ git+https://github.com/AssociatedPrimeIdeal/SpatioTemporalLabeler.git@b1301f249645cf4c0e885d08388887ba5482ba0e",
]
[project.scripts]
autoflow-run = "autoflow.cli:main"
autoflow-gui = "autoflow.ui.launcher:main"

[tool.setuptools.packages.find]
include = ["autoflow", "autoflow.*"]

[tool.setuptools.package-data]
autoflow = [
  "segmodel/nnUNetTrainerPartBalanced__nnUNetPlans__3d_fullres_iso1mm/dataset.json",
  "segmodel/nnUNetTrainerPartBalanced__nnUNetPlans__3d_fullres_iso1mm/plans.json",
  "segmodel/nnUNetTrainerPartBalanced__nnUNetPlans__3d_fullres_iso1mm/fold_all/checkpoint_final.pth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
