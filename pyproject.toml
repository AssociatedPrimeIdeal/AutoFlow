[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow-mri"
version = "2.0.0"
description = "Automated processing pipeline for 4D flow MRI with optional Qt GUI."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "scipy",
  "pyamg>=5.0,<6",
  "scikit-image",
  "networkx",
  "pyvista",
  "h5py",
  "imageio",
  "Pillow",
  "PyMaxflow",
  "joblib>=1.3",
]

[project.optional-dependencies]
dicom = [
  "dicom2h5 @ git+https://github.com/AssociatedPrimeIdeal/4DFlow_Dicom2H5.git@c6693c07f51255cd1004beb5bce9704a8f219e5c",
]
docs = [
  "mkdocs-material>=9.5,<10",
]
test = [
  "pytest",
]
gui = [
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "pyvistaqt",
  "matplotlib",
  "nnunetv2==2.5.2",
  "nibabel",
]
labeler = [
  "spatiotemporal-labeler @ git+https://github.com/AssociatedPrimeIdeal/SpatioTemporalLabeler.git@da9fd467264df9cc432f8222f82e175e5a89b641",
]
pu = [
  "pudipflow @ git+https://github.com/AssociatedPrimeIdeal/PUDIP-Flow.git@1b2b97e7344ee25cac3a2dd0c46513650b94d39e",
  "gustflow @ git+https://github.com/AssociatedPrimeIdeal/GUST-Flow.git@e68d90deb083a6fdf772fdc7cdcbe8dc71370c25 ; python_version >= '3.10'",
]
all = [
  "dicom2h5 @ git+https://github.com/AssociatedPrimeIdeal/4DFlow_Dicom2H5.git@c6693c07f51255cd1004beb5bce9704a8f219e5c",
  "mkdocs-material>=9.5,<10",
  "pytest",
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "pyvistaqt",
  "matplotlib",
  "nnunetv2==2.5.2",
  "nibabel",
  "spatiotemporal-labeler @ git+https://github.com/AssociatedPrimeIdeal/SpatioTemporalLabeler.git@da9fd467264df9cc432f8222f82e175e5a89b641",
  "pudipflow @ git+https://github.com/AssociatedPrimeIdeal/PUDIP-Flow.git@1b2b97e7344ee25cac3a2dd0c46513650b94d39e",
  "gustflow @ git+https://github.com/AssociatedPrimeIdeal/GUST-Flow.git@e68d90deb083a6fdf772fdc7cdcbe8dc71370c25 ; python_version >= '3.10'",
]
[project.scripts]
autoflow-run = "autoflow.cli:main"
autoflow-gui = "autoflow.ui.launcher:main"

[tool.setuptools.packages.find]
include = ["autoflow", "autoflow.*"]

[tool.setuptools.package-data]
autoflow = [
  "segmodel/nnUNetTrainerPartBalanced__nnUNetPlans__3d_fullres_iso1mm/dataset.json",
  "segmodel/nnUNetTrainerPartBalanced__nnUNetPlans__3d_fullres_iso1mm/plans.json",
  "segmodel/nnUNetTrainerPartBalanced__nnUNetPlans__3d_fullres_iso1mm/fold_all/checkpoint_final.pth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
